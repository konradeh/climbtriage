[project]
name = "climbtriage-backend"
version = "0.1.0"
description = "ClimbTriage recorded-analysis backend: resumable uploads, durable jobs, replaceable vision providers."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.22"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["climbtriage_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp -p no:cacheprovider"
